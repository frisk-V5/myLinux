name: Build Custom Arch Linux ISO (Docker)

on:
  workflow_dispatch:
    inputs:
      iso_name:
        description: '作成するISOのアーティファクト名'
        required: false
        default: 'custom-archlinux-kde-iso'
        type: string

jobs:
  build-iso:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t archiso-builder .

      - name: Run Docker container to build ISO
        run: |
          mkdir -p out
          docker run --rm --privileged \
            -v "$PWD/archiso:/build/archiso" \
            -v "$PWD/out:/build/out" \
            archiso-builder bash -c '
              cp -r /usr/share/archiso/configs/releng/ /tmp/archlive
              cat /build/archiso/packages.x86_64 >> /tmp/archlive/packages.x86_64
              
              cat << "EOF" >> /tmp/archlive/pacman.conf
          [customrepo]
          SigLevel = Optional TrustAll
          Server = file:///customrepo
          EOF

              mkdir -p /tmp/archlive/airootfs/etc/systemd/system/multi-user.target.wants
              ln -sf /usr/lib/systemd/system/NetworkManager.service /tmp/archlive/airootfs/etc/systemd/system/multi-user.target.wants/NetworkManager.service
              ln -sf /usr/lib/systemd/system/sddm.service /tmp/archlive/airootfs/etc/systemd/system/display-manager.service

              mkdir -p /tmp/archlive/airootfs/etc/environment.d
              cat << "EOF" > /tmp/archlive/airootfs/etc/environment.d/fcitx5.conf
          GTK_IM_MODULE=fcitx
          QT_IM_MODULE=fcitx
          XMODIFIERS=@im=fcitx
          EOF

              mkarchiso -v -w /tmp/work -o /build/out /tmp/archlive
            '

      - name: Upload Custom ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.iso_name }}
          path: out/*.iso
          retention-days: 5
